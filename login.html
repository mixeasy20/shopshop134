<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ - shopshop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo"><img src="icon-512.png" alt="Logo" class="logo"></div>
            <h1 class="login-brand">shopshop</h1>
            <p class="login-tagline" data-i18n="login_tagline">จดบันทึกรายการสิ่งของของคุณ <i class="fa-solid fa-book-open"></i></p>

            <div class="lang-switcher" style="justify-content: center; margin-bottom: 20px;">
                <button class="lang-btn" id="lang-th" onclick="changeLanguage('th')">TH</button>
                <button class="lang-btn" id="lang-en" onclick="changeLanguage('en')">EN</button>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login-btn" data-i18n="login_tab">เข้าสู่ระบบ</button>
                <button class="auth-tab" id="tab-register-btn" data-i18n="register_tab">สมัครสมาชิก</button>
            </div>

            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="login-email" data-i18n="label_email"><i class="fa-solid fa-envelope"></i> อีเมล</label>
                    <input type="email" id="login-email" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password" data-i18n="label_password"><i class="fa-solid fa-lock"></i> รหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-password"
                            onclick="togglePassword('login-password', this)"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-glow" data-i18n="btn_login"><i class="fa-solid fa-right-from-bracket"></i> เข้าสู่ระบบ</button>
                <p id="login-error" class="error-msg"></p>
            </form>

            <form id="register-form" class="auth-form" style="display:none;">
                <div class="input-group">
                    <label for="reg-email" data-i18n="label_email"><i class="fa-solid fa-envelope"></i> อีเมล</label>
                    <input type="email" id="reg-email" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label for="reg-password" data-i18n="label_password_min"><i class="fa-solid fa-lock"></i> รหัสผ่าน (อย่างน้อย 6 ตัว)</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-password"
                            onclick="togglePassword('reg-password', this)"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="reg-confirm" data-i18n="label_confirm_password"><i class="fa-solid fa-lock"></i> ยืนยันรหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-confirm" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-password"
                            onclick="togglePassword('reg-confirm', this)"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-glow" data-i18n="btn_register"><i class="fa-solid fa-user-plus"></i> สมัครสมาชิก</button>
                <p id="register-error" class="error-msg"></p>
            </form>

            <div class="auth-divider"><span data-i18n="auth_divider">หรือ</span></div>
            <button id="google-btn" class="btn-google" data-i18n="btn_google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20">
                ดำเนินการต่อด้วย Google
            </button>
            <p id="google-error" class="error-msg"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="i18n.js"></script>
    <script src="auth.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fa-solid fa-eye-slash";
            } else {
                input.type = "password";
                icon.className = "fa-solid fa-eye";
            }
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
